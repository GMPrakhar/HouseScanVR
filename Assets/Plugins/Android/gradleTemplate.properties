org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M -XX:MaxMetaspaceSize=512m

# Gradle defaults to parallel execution with a worker per core and a resident
# daemon. On a shared or pid-constrained machine that is what actually breaks
# the build: the JVM fails with pthread_create EAGAIN long before it runs out
# of memory. Serial execution costs a few minutes and is reliable.
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.configureondemand=false

unityStreamingAssets=**STREAMING_ASSETS**
**ADDITIONAL_PROPERTIES**
